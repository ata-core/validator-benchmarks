# Runs the whole benchmark on a GitHub runner and attaches the results file.
# On demand, and on the first day of each month; the runner's numbers are
# noisier than a laptop's and are not the ones in RESULTS.md, which says
# where its numbers came from.
name: Benchmark
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node run.mjs
      - run: node report.mjs results/*.json && cat RESULTS.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results
          path: |
            results/*.json
            RESULTS.md
